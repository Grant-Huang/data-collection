# 最简单的构建和测试检查：每个 PR 和推到 main 的提交都跑一遍
#   - 前端：安装依赖并执行正式构建（含 TypeScript 类型检查）
#   - 后端：安装依赖并运行 expert-collection/backend/tests
# backend/app/ 下的旧测试（test_phase3b_* 等）在 main 上本来就有失败，暂不纳入。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expert-collection/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expert-collection/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expert-collection/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: expert-collection/backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests
